# =============================================================================
# yolo-shixun · 本地开发环境清单（conda / mamba）
#
# 由 `mamba env export -n shixun --no-builds` 导出，对应本机 macOS(arm64) 环境：
#   Python 3.11.15 / conda-forge 频道 / streamlit 1.56.0 / ultralytics 8.4.39
#
# 复现方式：
#   mamba env create -f environment-shixun.yml
#   mamba activate shixun
#
# ⚠️ 为什么文件名不叫 environment.yml：
#   Streamlit Community Cloud 按固定优先级挑选依赖文件，顺序为
#   uv.lock > Pipfile > environment.yml > requirements.txt > pyproject.toml，
#   并且「只用找到的第一个」。如果本文件叫 environment.yml，云端会优先
#   走 conda 去解这份 macOS 专有清单，导致构建失败或长时间卡在
#   Solving environment。改名为 environment-shixun.yml 即可避开识别，
#   让云端正常使用 requirements.txt。
# =============================================================================

